name: ubuntu-publish

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      rotate_from:
        description: 旧公钥完整 40hex 指纹（可选，换钥时传入）
        required: false
        type: string
        default: ""

permissions: {}

concurrency:
  group: apt-hub-publish
  cancel-in-progress: false

jobs:
  preflight:
    name: 只读预检 Secret/Pages/actor
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    outputs:
      site_url: ${{ steps.pages.outputs.site_url }}
      git_name: ${{ steps.publisher.outputs.git_name }}
      git_email: ${{ steps.publisher.outputs.git_email }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 安装临时依赖
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl jq

      - name: 检查签名 secret 与 Pages URL
        id: pages
        env:
          APT_HUB_GPG_PRIVATE_KEY: ${{ secrets.APT_HUB_GPG_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set +x
          [[ -n "${APT_HUB_GPG_PRIVATE_KEY:-}" ]] || { echo "缺少 secrets.APT_HUB_GPG_PRIVATE_KEY" >&2; exit 1; }
          mkdir -p tmp
          code=$(curl -sS -o tmp/pages-api.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" || true)
          if [[ "$code" != "200" ]]; then
            echo "GitHub Pages 未启用或不可读（HTTP ${code}），拒绝发布" >&2
            rm -f tmp/pages-api.json
            exit 1
          fi
          site_url=$(jq -r '.html_url // empty' tmp/pages-api.json)
          rm -f tmp/pages-api.json
          [[ -n "$site_url" ]] || { echo "Pages API 未返回 html_url" >&2; exit 1; }
          site_url=${site_url%/}
          case "$site_url" in
            https://*) ;;
            *)
              echo "Pages html_url 不是 https: $site_url" >&2
              exit 1
              ;;
          esac
          echo "site_url=${site_url}" >>"$GITHUB_OUTPUT"
          echo "已读取 Pages URL（只读 API，未改设置）"

      - name: 解析发布者命令级身份
        id: publisher
        env:
          ACTOR_LOGIN: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          [[ "$ACTOR_ID" =~ ^[1-9][0-9]*$ ]] || { echo "actor_id 非法: $ACTOR_ID" >&2; exit 1; }
          [[ "$ACTOR_LOGIN" =~ ^[A-Za-z0-9]([A-Za-z0-9-]{0,37}[A-Za-z0-9])?$ ]] || {
            echo "actor login 非法: $ACTOR_LOGIN" >&2
            exit 1
          }
          mkdir -p tmp
          code=$(curl -sS -o tmp/actor.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/users/${ACTOR_LOGIN}" || true)
          if [[ "$code" != "200" ]]; then
            echo "无法读取 actor（HTTP ${code}）" >&2
            rm -f tmp/actor.json
            exit 1
          fi
          type=$(jq -r '.type // empty' tmp/actor.json)
          id=$(jq -r '.id | tostring' tmp/actor.json)
          login=$(jq -r '.login // empty' tmp/actor.json)
          rm -f tmp/actor.json
          [[ "$type" == "User" ]] || { echo "拒绝非人类 actor type=$type" >&2; exit 1; }
          [[ "$id" == "$ACTOR_ID" ]] || { echo "actor id 与上下文不一致" >&2; exit 1; }
          [[ "${login,,}" == "${ACTOR_LOGIN,,}" ]] || { echo "actor login 与上下文不一致" >&2; exit 1; }
          echo "git_name=${login}" >>"$GITHUB_OUTPUT"
          echo "git_email=${id}+${login}@users.noreply.github.com" >>"$GITHUB_OUTPUT"

  go_release:
    name: Go 构包发版
    needs: preflight
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    secrets: inherit

  build_verify:
    name: 构建校验并保存候选
    needs:
      - preflight
      - go_release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      pages: read
    outputs:
      site_ok: ${{ steps.gate.outputs.site_ok }}
      apt_data_sha: ${{ steps.save_apt_data.outputs.apt_data_sha }}
      git_name: ${{ needs.preflight.outputs.git_name }}
      git_email: ${{ needs.preflight.outputs.git_email }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 安装 CI 临时依赖
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl jq gnupg dpkg-dev apt-utils binutils xxd

      - name: 采用预检 Pages URL
        id: pages
        env:
          SITE_URL: ${{ needs.preflight.outputs.site_url }}
        run: |
          set -euo pipefail
          [[ -n "${SITE_URL:-}" ]] || { echo "缺少预检 site_url" >&2; exit 1; }
          echo "site_url=${SITE_URL}" >>"$GITHUB_OUTPUT"

      - name: 采用预检发布者身份
        id: publisher
        env:
          GIT_NAME: ${{ needs.preflight.outputs.git_name }}
          GIT_EMAIL: ${{ needs.preflight.outputs.git_email }}
        run: |
          set -euo pipefail
          [[ -n "${GIT_NAME:-}" && -n "${GIT_EMAIL:-}" ]] || { echo "缺少预检发布者身份" >&2; exit 1; }
          echo "git_name=${GIT_NAME}" >>"$GITHUB_OUTPUT"
          echo "git_email=${GIT_EMAIL}" >>"$GITHUB_OUTPUT"

      - name: 从 apt-data 恢复 previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p tmp/previous tmp/site tmp/verify tmp/gnupg
          chmod 700 tmp/gnupg
          if ! git ls-remote --heads origin apt-data > tmp/apt-data-refs.txt; then
            echo "列出 apt-data 失败（网络或鉴权），不能当首轮空目录" >&2
            exit 1
          fi
          if [[ ! -s tmp/apt-data-refs.txt ]]; then
            echo "apt-data 分支不存在，使用空 previous"
            : > tmp/apt-data-base.sha
            exit 0
          fi
          git fetch origin refs/heads/apt-data:refs/remotes/origin/apt-data
          sha=$(git rev-parse --verify origin/apt-data)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "无法解析 apt-data SHA" >&2; exit 1; }
          printf '%s\n' "$sha" > tmp/apt-data-base.sha
          git archive "$sha" | tar -x -C tmp/previous
          [[ -d tmp/previous ]] || { echo "恢复 apt-data 失败" >&2; exit 1; }

      - name: 导入生产签名密钥到临时 gnupg
        id: gpg
        env:
          APT_HUB_GPG_PRIVATE_KEY: ${{ secrets.APT_HUB_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          set +x
          export GNUPGHOME="$PWD/tmp/gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          printf '%s\n' 'pinentry-mode loopback' >"$GNUPGHOME/gpg.conf"
          printf '%s\n' "$APT_HUB_GPG_PRIVATE_KEY" | gpg --batch --import
          mapfile -t primary_fprs < <(
            gpg --batch --with-colons --list-secret-keys \
              | awk -F: '
                  /^sec:/{ want=1; next }
                  /^fpr:/ && want {
                    print toupper($10)
                    want=0
                  }
                '
          )
          if [[ "${#primary_fprs[@]}" -eq 0 ]]; then
            echo "导入后无私钥主身份" >&2
            exit 1
          fi
          if [[ "${#primary_fprs[@]}" -ne 1 ]]; then
            echo "需要恰好一个 primary secret identity，实际 ${#primary_fprs[@]} 个，拒绝歧义" >&2
            exit 1
          fi
          fpr=${primary_fprs[0]}
          [[ "$fpr" =~ ^[A-F0-9]{40}$ ]] || { echo "派生指纹非法: $fpr" >&2; exit 1; }
          if ! gpg --batch --with-colons --list-secret-keys --with-fingerprint -- "$fpr" \
            | awk -F: -v want="$fpr" 'BEGIN{n=0} /^fpr:/ { if (toupper($10)==want) n++ } END { exit n>0 ? 0 : 1 }'; then
            echo "无法按派生指纹列出私钥" >&2
            exit 1
          fi
          # 空口令真实签名检查；口令保护私钥应失败，不得等待交互。
          check_file=$(mktemp "$GNUPGHOME/key-check.XXXXXX")
          printf '%s\n' 'apt-hub-key-check' >"$check_file"
          sign_rc=0
          gpg --batch --yes --pinentry-mode loopback --passphrase '' \
            --local-user "$fpr" --clearsign --output /dev/null -- "$check_file" \
            || sign_rc=$?
          rm -f -- "$check_file"
          if [[ "$sign_rc" -ne 0 ]]; then
            echo "无口令签名检查失败；密钥须为 CI 可直接使用的无口令私钥" >&2
            exit 1
          fi
          echo "fingerprint=${fpr}" >>"$GITHUB_OUTPUT"

      - name: 下载 Go 冻结索引（若有）
        id: go_index
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: go-downloads-json
          path: tmp

      - name: 生成发行版数据并构建候选站点
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SITE_URL: ${{ steps.pages.outputs.site_url }}
          APT_HUB_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
          GO_RELEASE_TAG: ${{ needs.go_release.outputs.go_release_tag }}
          PACKAGE_REPOSITORY: ${{ github.repository }}
          ROTATE_FROM: ${{ inputs.rotate_from }}
        run: |
          set -euo pipefail
          set +x
          export GNUPGHOME="$PWD/tmp/gnupg"
          chmod a+x scripts/update_sources.sh scripts/ubuntu_releases.sh scripts/sync.sh scripts/render.sh scripts/verify_ubuntu.sh scripts/add_source.sh
          fpr=$(printf '%s' "$APT_HUB_FINGERPRINT" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')
          [[ "$fpr" =~ ^[A-F0-9]{40}$ ]] || { echo "fingerprint 非法" >&2; exit 1; }
          [[ -n "${SITE_URL:-}" ]] || { echo "缺少 Pages site_url" >&2; exit 1; }
          [[ -n "${GO_RELEASE_TAG:-}" ]] || { echo "缺少 go_release_tag" >&2; exit 1; }
          [[ -n "${PACKAGE_REPOSITORY:-}" ]] || { echo "缺少 package-repository" >&2; exit 1; }
          rm -rf tmp/update-candidate
          mkdir -p tmp/update-candidate
          update_args=(
            --catalog config/packages.json
            --previous tmp/previous
            --work-dir tmp/update-candidate
            --gnupghome "$GNUPGHOME"
            --fingerprint "$fpr"
            --site-url "$SITE_URL"
            --package-repository "${PACKAGE_REPOSITORY}"
            --go-release-tag "${GO_RELEASE_TAG}"
          )
          if [[ -f tmp/go-downloads.json ]]; then
            update_args+=(--go-downloads-json tmp/go-downloads.json)
          fi
          if [[ -n "${ROTATE_FROM:-}" ]]; then
            [[ "${ROTATE_FROM}" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "rotate_from 须为 40hex" >&2; exit 1; }
            update_args+=(--rotate-from "${ROTATE_FROM}")
          fi
          scripts/update_sources.sh "${update_args[@]}"
          [[ -f tmp/update-candidate/success.json ]] || { echo "单入口未写出 success.json" >&2; exit 1; }
          jq -e '.ok==true' tmp/update-candidate/success.json >/dev/null \
            || { echo "success.json ok!=true" >&2; exit 1; }
          rm -rf tmp/site tmp/verify
          mv tmp/update-candidate/site tmp/site
          mv tmp/update-candidate/verify tmp/verify
          cp -- tmp/update-candidate/README.md tmp/README.md
          cp -- tmp/update-candidate/releases.json tmp/releases.json

      - name: 检查产物大小并无符号链接
        id: gate
        run: |
          set -euo pipefail
          hit=$(find tmp/site -type l -print -quit) || {
            echo "候选站点符号链接检查失败，拒绝" >&2
            exit 1
          }
          if [[ -n "$hit" ]]; then
            echo "候选站点含符号链接，拒绝" >&2
            exit 1
          fi
          hit=$(find tmp/site ! -type f ! -type d -print -quit) || {
            echo "候选站点特殊文件检查失败，拒绝" >&2
            exit 1
          }
          if [[ -n "$hit" ]]; then
            echo "候选站点含特殊文件，拒绝" >&2
            exit 1
          fi
          [[ -f tmp/site/add_source.sh ]] || { echo "候选站点缺少普通 add_source.sh" >&2; exit 1; }
          [[ "$(stat -c '%a' tmp/site/add_source.sh)" == 644 ]] || { echo "add_source.sh 必须为 0644" >&2; exit 1; }
          cmp -s scripts/add_source.sh tmp/site/add_source.sh || { echo "add_source.sh 与本次 checkout 不一致" >&2; exit 1; }
          hit=$(find tmp/site -name '*.deb' -print -quit) || {
            echo "候选站点 .deb 检查失败，拒绝" >&2
            exit 1
          }
          if [[ -n "$hit" ]]; then
            echo "候选站点含 .deb，拒绝" >&2
            exit 1
          fi
          if grep -r -a -n -E '^-----BEGIN ([A-Z0-9 ]*PRIVATE KEY( BLOCK)?|PGP SECRET KEY BLOCK)-----[[:space:]]*$' tmp/site; then
            echo "候选站点含私钥材料，拒绝" >&2
            exit 1
          fi
          bytes=$(du -sb tmp/site | awk '{print $1}')
          echo "site_bytes=$bytes"
          if [[ "$bytes" -gt 1073741824 ]]; then
            echo "候选站点超过 GitHub Pages 1GB 上限: $bytes" >&2
            exit 1
          fi
          for name in apt-hub.gpg state.json index.html add_source.sh repos; do
            [[ -e "tmp/site/$name" ]] || { echo "候选站点缺少 $name" >&2; exit 1; }
          done
          echo "site_ok=true" >>"$GITHUB_OUTPUT"

      - name: 快进保存 apt-data
        id: save_apt_data
        env:
          GH_TOKEN: ${{ github.token }}
          APT_HUB_GIT_NAME: ${{ steps.publisher.outputs.git_name }}
          APT_HUB_GIT_EMAIL: ${{ steps.publisher.outputs.git_email }}
        run: |
          set -euo pipefail
          [[ -n "${APT_HUB_GIT_NAME:-}" && -n "${APT_HUB_GIT_EMAIL:-}" ]] || {
            echo "缺少已核验发布者身份" >&2
            exit 1
          }
          export GIT_AUTHOR_NAME="$APT_HUB_GIT_NAME"
          export GIT_AUTHOR_EMAIL="$APT_HUB_GIT_EMAIL"
          export GIT_COMMITTER_NAME="$APT_HUB_GIT_NAME"
          export GIT_COMMITTER_EMAIL="$APT_HUB_GIT_EMAIL"
          work="$PWD/tmp/apt-data-git"
          rm -rf "$work"
          mkdir -p "$work"
          git -C "$work" init
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | openssl base64 -A)
          git -C "$work" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git_auth() {
            git -C "$work" -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH}" "$@"
          }
          copy_site() {
            local name
            local names=(apt-hub.gpg state.json index.html add_source.sh repos)
            for name in "${names[@]}"; do
              [[ -e "tmp/site/$name" ]] || { echo "候选站点缺少 $name" >&2; exit 1; }
              rm -rf "$work/$name"
              cp -a "tmp/site/$name" "$work/$name"
            done
            git -C "$work" add -- "${names[@]}"
            if git -C "$work" rev-parse --verify HEAD >/dev/null 2>&1; then
              git -C "$work" add -u -- "${names[@]}"
            fi
          }
          refuse_non_whitelist() {
            local rel dirty=0
            while IFS= read -r rel; do
              [[ -n "$rel" ]] || continue
              case "$rel" in
                apt-hub.gpg|state.json|index.html|add_source.sh|repos|repos/*) ;;
                *)
                  echo "apt-data 含白名单外路径，拒绝保存: $rel" >&2
                  dirty=1
                  ;;
              esac
            done < <(git -C "$work" ls-files)
            [[ "$dirty" -eq 0 ]] || exit 1
          }
          if [[ -s tmp/apt-data-base.sha ]]; then
            base=$(tr -d '[:space:]' < tmp/apt-data-base.sha)
            [[ "$base" =~ ^[0-9a-f]{40}$ ]] || { echo "apt-data 基线 SHA 非法" >&2; exit 1; }
            git_auth fetch origin refs/heads/apt-data:refs/remotes/origin/apt-data
            git -C "$work" checkout -B apt-data "$base"
            refuse_non_whitelist
            copy_site
            refuse_non_whitelist
            if git -C "$work" diff --cached --quiet; then
              echo "apt-data 已与候选一致，无需新提交"
            else
              git -C "$work" -c "user.name=${APT_HUB_GIT_NAME}" -c "user.email=${APT_HUB_GIT_EMAIL}" commit -m "更新候选 APT 站点数据"
            fi
            if ! git_auth push origin apt-data; then
              echo "apt-data 快进推送失败，禁止 force，请重跑" >&2
              exit 1
            fi
          else
            if git -C "$work" ls-remote --heads origin apt-data | grep -q .; then
              echo "apt-data 在恢复后被创建，禁止把首轮快照覆到新分支上" >&2
              exit 1
            fi
            git -C "$work" checkout -B apt-data
            copy_site
            refuse_non_whitelist
            git -C "$work" -c "user.name=${APT_HUB_GIT_NAME}" -c "user.email=${APT_HUB_GIT_EMAIL}" commit -m "初始化候选 APT 站点数据"
            if ! git_auth push -u origin apt-data; then
              echo "创建 apt-data 失败（网络/鉴权/并发），不能当已发布" >&2
              exit 1
            fi
          fi
          saved=$(git -C "$work" rev-parse HEAD)
          [[ "$saved" =~ ^[0-9a-f]{40}$ ]] || { echo "无法读取保存后的 apt-data SHA" >&2; exit 1; }
          echo "apt_data_sha=$saved" >>"$GITHUB_OUTPUT"

      - name: 上传 Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: tmp/site

      - name: 清理临时密钥
        if: always()
        run: |
          set -euo pipefail
          export GNUPGHOME="$PWD/tmp/gnupg"
          gpgconf --kill gpg-agent 2>/dev/null || true
          rm -rf tmp/gnupg

  deploy_pages:
    name: 部署 GitHub Pages
    needs: build_verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  update_readme:
    name: 部署成功后回写 README
    needs:
      - build_verify
      - deploy_pages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 安装 CI 临时依赖
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl jq

      - name: 用已部署 state 更新 README
        env:
          GH_TOKEN: ${{ github.token }}
          APT_HUB_GIT_NAME: ${{ needs.build_verify.outputs.git_name }}
          APT_HUB_GIT_EMAIL: ${{ needs.build_verify.outputs.git_email }}
        run: |
          set -euo pipefail
          [[ -n "${APT_HUB_GIT_NAME:-}" && -n "${APT_HUB_GIT_EMAIL:-}" ]] || {
            echo "缺少已核验发布者身份" >&2
            exit 1
          }
          mkdir -p tmp/readme-site data
          SHA="${{ needs.build_verify.outputs.apt_data_sha }}"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "缺少已保存 apt-data SHA" >&2; exit 1; }
          git fetch origin refs/heads/apt-data:refs/remotes/origin/apt-data
          git cat-file -e "${SHA}^{commit}" || { echo "已部署 SHA 不在 apt-data 历史中" >&2; exit 1; }
          git archive "$SHA" | tar -x -C tmp/readme-site
          [[ -f tmp/readme-site/state.json ]] || { echo "apt-data 缺少 state.json" >&2; exit 1; }
          chmod a+x scripts/render.sh
          cp tmp/readme-site/state.json data/published.json
          scripts/render.sh --state data/published.json --readme README.md --site tmp/readme-site
          export GIT_AUTHOR_NAME="$APT_HUB_GIT_NAME"
          export GIT_AUTHOR_EMAIL="$APT_HUB_GIT_EMAIL"
          export GIT_COMMITTER_NAME="$APT_HUB_GIT_NAME"
          export GIT_COMMITTER_EMAIL="$APT_HUB_GIT_EMAIL"
          git add README.md data/published.json
          if git diff --cached --quiet; then
            echo "README 与已发布状态已一致"
            exit 0
          fi
          git -c "user.name=${APT_HUB_GIT_NAME}" -c "user.email=${APT_HUB_GIT_EMAIL}" commit -m "回写已部署的软件列表"
          if ! git push origin HEAD; then
            echo "主分支有并发更新，禁止 force，请重跑工作流" >&2
            exit 1
          fi
