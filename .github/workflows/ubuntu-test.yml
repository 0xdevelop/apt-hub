name: ubuntu-test

on:
  push:
  pull_request:

permissions: {}

concurrency:
  group: ubuntu-test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fixture_test:
    name: 无私钥夹具测试
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 安装 CI 临时依赖
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl jq gnupg dpkg-dev apt-utils shellcheck binutils xxd

      - name: ShellCheck 全仓 tracked shell
        run: |
          set -euo pipefail
          mapfile -t scripts < <(
            git ls-files -z -- '*.sh' | tr '\0' '\n' | awk 'NF'
          )
          [[ "${#scripts[@]}" -gt 0 ]] || { echo "未找到 tracked *.sh" >&2; exit 1; }
          shellcheck -s bash -- "${scripts[@]}"

      - name: 运行 A/B/C 夹具与 workflow 消费者测试
        run: |
          set -euo pipefail
          chmod a+x \
            tests/ubuntu_test.sh tests/sync_test.sh tests/render_test.sh \
            tests/workflow_test.sh tests/add_source_test.sh tests/update_sources_test.sh \
            tests/release_test.sh tests/go_source_test.sh \
            scripts/ubuntu_releases.sh scripts/verify_ubuntu.sh \
            scripts/sync.sh scripts/render.sh scripts/add_source.sh \
            scripts/update_sources.sh scripts/release_golang.sh \
            git_tag.sh build.sh gen_deb_golang.sh
          mkdir -p tmp
          set +e
          (
            tests/ubuntu_test.sh &&
            tests/sync_test.sh &&
            tests/render_test.sh &&
            tests/workflow_test.sh &&
            tests/add_source_test.sh &&
            tests/update_sources_test.sh &&
            tests/go_source_test.sh &&
            tests/release_test.sh
          ) >tmp/ci-tests.log 2>&1
          rc=$?
          set -e
          cat tmp/ci-tests.log
          if [[ "$rc" -eq 0 ]]; then
            exit 0
          fi
          awk '
            /^FAIL/ {
              if (n < 20) {
                if (n == 0) print "FAIL断言:"
                print NR ":" $0
                n++
              }
            }
            /: (error|warning|note): / {
              if (s < 20) {
                if (s == 0) print "ShellCheck:"
                print NR ":" $0
                s++
              }
            }
            END { if (n > 0 || s > 0) print "---" }
          ' tmp/ci-tests.log >tmp/ci-diag-tail.txt
          tail -n 40 tmp/ci-tests.log >>tmp/ci-diag-tail.txt
          diag=$(head -c 16384 tmp/ci-diag-tail.txt)
          rm -f tmp/ci-diag-tail.txt
          if [[ -z "$diag" ]]; then
            diag='（ci-tests.log 末尾为空）'
          fi
          diag=${diag//'%'/'%25'}
          diag=${diag//$'\r'/'%0D'}
          diag=${diag//$'\n'/'%0A'}
          printf '%s\n' "::error title=夹具测试失败::${diag}"
          exit "$rc"

      - name: Go 离线构包与 APT 升级夹具
        run: |
          set -euo pipefail
          chmod a+x gen_deb_golang.sh build.sh tests/go_deb_test.sh
          tests/go_deb_test.sh
