name: Release_Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      rotate_from:
        description: 旧公钥完整 40hex 指纹（可选，换钥时传入）
        required: false
        type: string
        default: ""

concurrency:
  group: apt-hub-publish
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
      build_packages: ${{ steps.tag.outputs.build_packages }}
      reuse_from_tag: ${{ steps.tag.outputs.reuse_from_tag }}
      package_release_tag: ${{ steps.tag.outputs.package_release_tag }}
      go_version: ${{ steps.tag.outputs.go_version }}
      source_sha: ${{ steps.tag.outputs.source_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 安装临时依赖
        timeout-minutes: 10
        run: bash scripts/ci_dependencies.sh release

      - name: 解析本次或既有 vtag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          got="$(tr -d '[:space:]' <VERSION)"
          [[ "${got}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "VERSION 非法" >&2; exit 1; }
          tag="v${got}"
          if [[ "${EVENT_NAME}" == "push" ]]; then
            [[ "${REF}" == "refs/tags/${tag}" ]] || { echo "VERSION 与 tag 不符" >&2; exit 1; }
          else
            [[ "${EVENT_NAME}" == workflow_dispatch ]] || exit 1
          fi
          git fetch origin refs/heads/main:refs/remotes/origin/main
          source_sha=$(git rev-parse HEAD)
          [[ "${source_sha}" == "$(git rev-parse origin/main)" ]] || { echo "拒绝过时运行，不回退已发布版本" >&2; exit 1; }
          remote_tag=$(git ls-remote origin "refs/tags/${tag}")
          if [[ -z "${remote_tag}" ]]; then
            [[ "$(git log -1 --format=%s)" == "Release:--: ${tag}_"* && -f "changelog/${tag}.md" ]] || { echo "缺少可恢复的原版本提交" >&2; exit 1; }
            git push origin "${source_sha}:refs/tags/${tag}"
          else
            [[ "${remote_tag%%$'\t'*}" == "$(git rev-parse "${tag}^{commit}")" ]] || exit 1
          fi
          mkdir -p tmp
          plan_args=(--repository "${REPOSITORY}" --tag "${tag}")
          git ls-remote --heads origin refs/heads/apt-hub-pages >tmp/previous-refs
          if [[ -s tmp/previous-refs ]]; then
            git fetch origin refs/heads/apt-hub-pages
            if git cat-file -e FETCH_HEAD:state.json 2>/dev/null; then
              git show FETCH_HEAD:state.json >tmp/previous-state.json
              plan_args+=(--previous-state tmp/previous-state.json)
            else
              [[ "$(git ls-tree --name-only FETCH_HEAD)" == .nojekyll ]] || { echo "Pages 产物缺少state且不是首次骨架" >&2; exit 1; }
            fi
          fi
          bash scripts/release_assets.sh plan "${plan_args[@]}" >tmp/release-plan
          build_packages=$(awk -F= '$1=="build_packages"{print $2}' tmp/release-plan)
          bump_release=$(awk -F= '$1=="bump_release"{print $2}' tmp/release-plan)
          package_tag=$(awk -F= '$1=="package_release_tag"{print $2}' tmp/release-plan)
          go_version=$(awk -F= '$1=="go_version"{print $2}' tmp/release-plan)
          reuse_from_tag=$(awk -F= '$1=="reuse_from_tag"{print $2}' tmp/release-plan)
          [[ "${build_packages}" =~ ^[01]$ && "${bump_release}" =~ ^[01]$ && "${package_tag}" == "${tag}" && "${package_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          if [[ -n "${reuse_from_tag}" ]]; then
            [[ "${build_packages}" == 0 && "${bump_release}" == 0 && "${reuse_from_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            dpkg --compare-versions "${reuse_from_tag#v}" lt "${tag#v}" || exit 1
          fi
          printf 'release_tag=%s\npackage_release_tag=%s\ngo_version=%s\nbuild_packages=%s\nreuse_from_tag=%s\nsource_sha=%s\n' "${tag}" "${package_tag}" "${go_version}" "${build_packages}" "${reuse_from_tag}" "${source_sha}" >>"$GITHUB_OUTPUT"

      - name: 本仓 vtag Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          skipIfReleaseExists: true
          tag: ${{ steps.tag.outputs.release_tag }}
          name: ${{ steps.tag.outputs.release_tag }}
          bodyFile: changelog/${{ steps.tag.outputs.release_tag }}.md
          commit: ${{ steps.tag.outputs.source_sha }}

  Build:
    name: Build
    needs: release
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout 本次 vtag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.source_sha }}

      - name: 安装构包与签源依赖
        timeout-minutes: 10
        run: bash scripts/ci_dependencies.sh build

      - name: 缓存上游 Go 归档载荷
        if: needs.release.outputs.build_packages == '1' && needs.release.outputs.go_version != ''
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: tmp/go-archives
          key: go-archives-${{ needs.release.outputs.go_version }}-${{ hashFiles('config/go.json') }}

      - name: 构包或跳过已完成 vtag
        id: assets
        if: needs.release.outputs.build_packages == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.release_tag }}
          PACKAGE_RELEASE_TAG: ${{ needs.release.outputs.package_release_tag }}
          GO_VERSION: ${{ needs.release.outputs.go_version }}
        run: |
          set -euo pipefail
          chmod a+x scripts/release_assets.sh build.sh gen_debs.sh scripts/gen_deb_golang.sh
          [[ "${PACKAGE_RELEASE_TAG}" == "${TAG}" ]] || exit 1
          [[ "${GO_VERSION}" =~ ^go[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          mkdir -p tmp tmp/go-archives
          curl -fsSL --proto '=https' --proto-redir '=https' --connect-timeout 20 --max-time 120 --retry 2 'https://go.dev/dl/?mode=json&include=all' -o tmp/go-downloads.json
          scripts/release_assets.sh prepare-archives --go-version "${GO_VERSION}" --downloads-json tmp/go-downloads.json --archive-dir tmp/go-archives || exit $?
          bash ./build.sh --go-version "${GO_VERSION}" --downloads-json tmp/go-downloads.json --archive-dir tmp/go-archives && bash ./build.sh test || exit $?
          scripts/release_assets.sh local-status --asset-dir build/upload_tmp_dir || exit $?
          printf 'upload=1\n' >>"$GITHUB_OUTPUT"

      - name: 复用已核验旧 Release 资产
        id: reuse
        if: needs.release.outputs.build_packages == '0' && needs.release.outputs.reuse_from_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.release_tag }}
          PACKAGE_RELEASE_TAG: ${{ needs.release.outputs.package_release_tag }}
          REUSE_FROM_TAG: ${{ needs.release.outputs.reuse_from_tag }}
          GO_VERSION: ${{ needs.release.outputs.go_version }}
        run: |
          set -euo pipefail
          chmod a+x scripts/release_assets.sh
          [[ "${PACKAGE_RELEASE_TAG}" == "${TAG}" ]] || exit 1
          [[ "${REUSE_FROM_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ "${GO_VERSION}" =~ ^go[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          dpkg --compare-versions "${REUSE_FROM_TAG#v}" lt "${TAG#v}" || exit 1
          mkdir -p tmp
          curl -fsSL --proto '=https' --proto-redir '=https' --connect-timeout 20 --max-time 120 --retry 2 'https://go.dev/dl/?mode=json&include=all' -o tmp/go-downloads.json
          scripts/release_assets.sh prepare-reuse --repository "${REPOSITORY}" --source-tag "${REUSE_FROM_TAG}" --tag "${TAG}" --downloads-json tmp/go-downloads.json --asset-dir build/upload_tmp_dir || exit $?
          scripts/release_assets.sh local-status --repository "${REPOSITORY}" --tag "${TAG}" --asset-dir build/upload_tmp_dir || exit $?
          printf 'upload=1\n' >>"$GITHUB_OUTPUT"

      - name: Upload binaries
        id: upload_file_to_release
        if: steps.assets.outputs.upload == '1' || steps.reuse.outputs.upload == '1'
        uses: george012/upload_github_release_assets_action@latest
        with:
          path: ./build/upload_tmp_dir/*

      - name: 核验已上传包来源
        if: needs.release.outputs.go_version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.release_tag }}
        run: bash scripts/release_assets.sh remote-status --repository "${REPOSITORY}" --tag "${TAG}" --source-tag

  PublishPages:
    name: PublishPages
    needs:
      - release
      - Build
    if: always() && needs.release.result == 'success' && (needs.Build.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.Build.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout 本次 vtag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.source_sha }}

      - name: 安装构包与签源依赖
        timeout-minutes: 10
        run: bash scripts/ci_dependencies.sh build

      - name: 读取 Pages 来源和发布者
        id: config
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/reindex_apt_repo.sh preflight

      - name: 生成并发布 Pages 产物分支
        env:
          GH_TOKEN: ${{ github.token }}
          APT_HUB_GPG_PRIVATE_KEY: ${{ secrets.APT_HUB_GPG_PRIVATE_KEY }}
          APT_HUB_GIT_NAME: ${{ steps.config.outputs.git_name }}
          APT_HUB_GIT_EMAIL: ${{ steps.config.outputs.git_email }}
          SITE_URL: ${{ steps.config.outputs.site_url }}
          PAGES_CNAME: ${{ steps.config.outputs.cname }}
          RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
          PACKAGE_RELEASE_TAG: ${{ needs.release.outputs.package_release_tag }}
          ROTATE_FROM: ${{ inputs.rotate_from }}
        run: bash scripts/reindex_apt_repo.sh publish

  RemoveOldRelease:
    name: RemoveOldRelease
    needs:
      - release
      - PublishPages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.source_sha }}

      - name: 安装临时依赖
        timeout-minutes: 10
        run: bash scripts/ci_dependencies.sh cleanup

      - name: 清理两代前 Release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: push
          REF: refs/tags/${{ needs.release.outputs.release_tag }}
        run: |
          set -euo pipefail
          chmod a+x scripts/reindex_apt_repo.sh
          scripts/reindex_apt_repo.sh remove-old
