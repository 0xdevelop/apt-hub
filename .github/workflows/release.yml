name: Release_Build

on:
  push:
    tags:
      - 'v*'
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      rotate_from:
        description: 旧公钥完整 40hex 指纹（可选，换钥时传入）
        required: false
        type: string
        default: ""

permissions: {}

concurrency:
  group: apt-hub-publish
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
      build_packages: ${{ steps.tag.outputs.build_packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 安装临时依赖
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl jq

      - name: 解析本次或既有 vtag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          got="$(tr -d '[:space:]' <VERSION)"
          [[ "${got}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "VERSION 非法" >&2; exit 1; }
          if [[ "${EVENT_NAME}" == "push" && "${REF}" =~ ^refs/tags/(v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            tag="${BASH_REMATCH[1]}"
            [[ "v${got}" == "${tag}" ]] || { echo "VERSION 与 tag 不符" >&2; exit 1; }
            echo "release_tag=${tag}" >>"$GITHUB_OUTPUT"
            echo "build_packages=1" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${EVENT_NAME}" == "workflow_dispatch" || "${EVENT_NAME}" == "schedule" ]]; then
            tag="v${got}"
            git rev-parse -q --verify "refs/tags/${tag}" >/dev/null \
              || { echo "缺少既有 tag ${tag}" >&2; exit 1; }
            echo "release_tag=${tag}" >>"$GITHUB_OUTPUT"
            echo "build_packages=0" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "不支持的事件: ${EVENT_NAME}" >&2
          exit 1


      - name: 本仓 vtag Release
        if: steps.tag.outputs.build_packages == '1'
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          skipIfReleaseExists: true
          tag: ${{ steps.tag.outputs.release_tag }}
          name: ${{ steps.tag.outputs.release_tag }}
          bodyFile: changelog/${{ steps.tag.outputs.release_tag }}.md

  Build:
    name: Build
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout 本次 vtag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 安装构包与签源依赖
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl jq gh gnupg dpkg-dev apt-utils binutils shellcheck xxd

      - name: 读取 Pages 来源和发布者
        id: config
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish_apt_site.sh preflight

      - name: 构包或跳过已完成 vtag
        id: assets
        if: needs.release.outputs.build_packages == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.release_tag }}
        run: |
          set -euo pipefail
          chmod a+x scripts/release_assets.sh build.sh gen_debs.sh scripts/gen_deb_golang.sh
          set +e
          scripts/release_assets.sh remote-status --repository "${REPOSITORY}" --tag "${TAG}"
          st=$?
          set -e
          if [[ "${st}" -eq 0 ]]; then
            echo "upload=0" >>"$GITHUB_OUTPUT"
            echo "已有完整构造包，跳过构建与上传"
            exit 0
          fi
          if [[ "${st}" -ne 10 ]]; then
            echo "构造包不完整或冲突，拒绝覆盖" >&2
            exit "${st}"
          fi
          bash ./build.sh && bash ./build.sh test || exit $?
          scripts/release_assets.sh local-status --asset-dir ./build/upload_tmp_dir || exit $?
          echo "upload=1" >>"$GITHUB_OUTPUT"

      - name: 上传构造包
        if: steps.assets.outputs.upload == '1'
        uses: george012/upload_github_release_assets_action@b56f61e7a10692c6ee2d7482b451911393479030
        with:
          path: ./build/upload_tmp_dir/*
          tag_name: ${{ needs.release.outputs.release_tag }}
          token: ${{ github.token }}
          fail_on_unmatched_files: true

      - name: 生成并发布 Pages 产物分支
        env:
          GH_TOKEN: ${{ github.token }}
          APT_HUB_GPG_PRIVATE_KEY: ${{ secrets.APT_HUB_GPG_PRIVATE_KEY }}
          APT_HUB_GIT_NAME: ${{ steps.config.outputs.git_name }}
          APT_HUB_GIT_EMAIL: ${{ steps.config.outputs.git_email }}
          SITE_URL: ${{ steps.config.outputs.site_url }}
          PAGES_CNAME: ${{ steps.config.outputs.cname }}
          RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
          ROTATE_FROM: ${{ inputs.rotate_from }}
        run: bash scripts/publish_apt_site.sh publish

  RemoveOldRelease:
    name: RemoveOldRelease
    needs:
      - release
      - Build
    if: needs.release.outputs.build_packages == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 安装临时依赖
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl jq gh

      - name: 清理两代前 Release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          chmod a+x scripts/publish_apt_site.sh
          scripts/publish_apt_site.sh remove-old
